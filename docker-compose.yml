services:
  streamsync:
    build: .
    container_name: streamsync
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - DATABASE_URL=file:./prisma/dev.db
    volumes:
      - ./prisma:/app/prisma
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 300 --cleanup --label-enable
    # This will check for updates every 5 minutes (300s)
    # and only update containers with the 'watchtower.enable' label.
